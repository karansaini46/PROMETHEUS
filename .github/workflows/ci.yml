name: PROMETHEUS Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-ci:
    name: Backend Lint, Type Check & Test (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prometheus
          POSTGRES_PASSWORD: prometheus
          POSTGRES_DB: prometheus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"

      - name: Check Python Code Formatting (Ruff)
        run: ruff format --check .

      - name: Lint Python Codebase (Ruff)
        run: ruff check .

      - name: Strict Static Type Checking (Mypy)
        run: mypy services prometheus_ai tests

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://prometheus:prometheus@localhost:5432/prometheus_test
        run: alembic upgrade head

      - name: Execute Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://prometheus:prometheus@localhost:5432/prometheus_test
        run: pytest -v --cov=services --cov=prometheus_ai tests/

  frontend-ci:
    name: Frontend Lint, Type Check & Test (Next.js & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Shared Types Package
        working-directory: packages/shared-types
        run: |
          npm ci || npm install
          npm run build

      - name: Install Dashboard Dependencies
        working-directory: apps/dashboard
        run: |
          npm ci || npm install

      - name: Lint Next.js Codebase (ESLint)
        working-directory: apps/dashboard
        run: npm run lint

      - name: Strict TypeScript Compilation Check
        working-directory: apps/dashboard
        run: npm run type-check

      - name: Execute Vitest Frontend Test Suite
        working-directory: apps/dashboard
        run: npm run test

      - name: Verify Next.js Production Build
        working-directory: apps/dashboard
        run: npm run build
