name: PROMETHEUS Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-ci:
    name: Backend Lint, Type Check & Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check Python Code Formatting (Ruff)
        run: ruff format --check .

      - name: Lint Python Codebase (Ruff)
        run: ruff check .

      - name: Strict Static Type Checking (Mypy)
        run: mypy services prometheus_ai tests

      - name: Execute Pytest Suite
        run: pytest -v --cov=services --cov=prometheus_ai tests/

  frontend-ci:
    name: Frontend Lint, Type Check & Test (Next.js & TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build Shared Types Package
        working-directory: packages/shared-types
        run: |
          npm ci || npm install
          npm run build

      - name: Install Dashboard Dependencies
        working-directory: apps/dashboard
        run: |
          npm ci || npm install

      - name: Lint Next.js Codebase (ESLint)
        working-directory: apps/dashboard
        run: npm run lint

      - name: Strict TypeScript Compilation Check
        working-directory: apps/dashboard
        run: npm run type-check

      - name: Execute Vitest Frontend Test Suite
        working-directory: apps/dashboard
        run: npm run test

      - name: Verify Next.js Production Build
        working-directory: apps/dashboard
        run: npm run build
