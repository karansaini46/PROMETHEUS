[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prometheus"
version = "0.1.0"
description = "Autonomous AI Software Engineering & Debugging Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "PROMETHEUS Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.32.0,<0.35.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.35,<2.1.0",
    "asyncpg>=0.29.0,<0.31.0",
    "alembic>=1.13.0,<1.15.0",
    "httpx>=0.27.0,<0.29.0",
    "docker>=7.1.0,<8.0.0",
    "python-multipart>=0.0.12,<0.1.0",
    "opentelemetry-api>=1.27.0,<1.31.0",
    "opentelemetry-sdk>=1.27.0,<1.31.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<0.52b0",
    "anthropic>=0.18.0",
    "openai>=1.0.0",
    "pgvector>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "torch>=2.2.0",
]
ml = [
    # Lightweight / CPU-compatible deep learning dependencies
    "torch>=2.2.0",
    "numpy>=1.26.0",
]


[tool.setuptools.packages.find]
include = ["prometheus_ai*", "services*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = [
    "docker",
    "docker.*",
    "opentelemetry.*",
    "sqlalchemy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q --strict-markers"
markers = [
    "unit: fast unit tests",
    "integration: integration tests with mock or local dependencies",
    "security: sandbox and injection security boundary tests",
    "e2e: end to end workflow tests",
]
